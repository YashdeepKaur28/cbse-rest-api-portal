<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Login</title></head>
<body>
<h3>Login to CBSE Student Result Management</h3>
<div id="msg"></div>
<form id="loginForm">
    Username or Email: <input type="text" id="username"><br>
    Password: <input type="password" id="password"><br>
    <input type="checkbox" id="remember"> Remember Me<br>
    <input type="submit" value="Login">
</form>
<br><a href="register.html">New User? Register here</a>

<script>
function getCookie(n) {
    var p = n + "=", ca = document.cookie.split(';');
    for (var i = 0; i < ca.length; i++) {
        var c = ca[i].trim();
        if (c.indexOf(p) === 0) return decodeURIComponent(c.substring(p.length));
    }
    return "";
}
window.onload = function() {
    var u = getCookie("username"), p = getCookie("password");
    if (u) {
        document.getElementById("username").value = u;
        document.getElementById("password").value = p;
        document.getElementById("remember").checked = true;
    }
};
document.getElementById('loginForm').onsubmit = function(e) {
    e.preventDefault();
    var m = document.getElementById('msg');
    m.style.color = "blue";
    m.innerHTML = "Logging in...";
    var rem = document.getElementById('remember').checked ? "yes" : "no";
    var d = "username=" + encodeURIComponent(document.getElementById('username').value)
          + "&password=" + encodeURIComponent(document.getElementById('password').value)
          + "&remember=" + rem;
    var x = new XMLHttpRequest();
    x.open("POST", "rest/users/login", true);
    x.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    x.onreadystatechange = function() {
        if (x.readyState === 4) {
            if (x.status === 200) {
                window.location.href = "index.html";
            } else {
                m.style.color = "red";
                try { m.innerHTML = JSON.parse(x.responseText).message; }
                catch (err) { m.innerHTML = "Error " + x.status; }
            }
        }
    };
    x.send(d);
};
</script>
</body>
</html>
